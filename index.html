<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{--noite:#000000;--bg2:#0A0A0A;--card:#141414;--card2:#1C1C1C;--linha:#262626;--linha2:#333333;--chalk:#F3F3EC;--cinza:#A3A3AB;--grafite:#5F5F67;
--volt:#D5FF3F;--voltx:var(--volt);--flash:#EF8FC4;--cobalt:#561D45;--ameixa:#561D45;--oliva:#C9DB82;--ok:#7CE38B;--warn:#FFB547;--bad:#FF5C6C;
--fh:Figtree,system-ui,-apple-system,sans-serif;--fb:"Bricolage Grotesque",Figtree,sans-serif;--safe-t:env(safe-area-inset-top);--safe-b:env(safe-area-inset-bottom);--side:244px;--rail:310px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--noite);color:var(--chalk);font-family:Figtree,system-ui,-apple-system,sans-serif;font-size:13.5px;line-height:1.45;overflow-x:hidden}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,.uh{font-family:var(--fh);letter-spacing:-.01em;margin:0;font-weight:700}
a{color:inherit}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
/* logo */
.logo{font-family:var(--fh);font-weight:800;font-size:24px;color:var(--voltx);text-shadow:2px 2px 0 var(--flash);position:relative;display:inline-block;line-height:1}
.logo .sp{color:var(--flash);font-size:12px;position:absolute;left:27px;top:-8px;text-shadow:none}
.live{font-size:10px;font-weight:700;letter-spacing:.16em;color:var(--flash);text-transform:uppercase}
/* ===== shell ===== */
.side{position:fixed;top:0;bottom:0;left:0;width:var(--side);background:var(--bg2);border-right:1px solid var(--linha);padding:calc(20px + var(--safe-t)) 12px calc(14px + var(--safe-b));overflow-y:auto;z-index:40;display:flex;flex-direction:column}
.sbrand{padding:4px 10px 18px}
.sbrand .tagline{font-size:11px;color:var(--cinza);margin-top:10px;line-height:1.4}
.sgrp{font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--grafite);padding:14px 12px 6px}
.sitem{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;border-radius:12px;padding:8px 12px;min-height:46px;text-align:left;cursor:pointer;color:var(--chalk);margin-bottom:2px}
.sitem:hover{background:var(--card)}
.sitem .sl{flex:1;min-width:0;display:flex;flex-direction:column}
.sitem .sl b{font-weight:600;font-size:13.5px}
.sitem .sl small{font-size:11px;color:var(--cinza);margin-top:1px}
.sitem svg{color:var(--cinza)}
.sitem.on{background:var(--volt);color:#000}
.sitem.on svg,.sitem.on small{color:#2a3300}
.sbad{background:var(--flash);color:#131411;border-radius:999px;font-size:10.5px;font-weight:700;padding:1px 7px}
.sitem.on .sbad{background:#000;color:var(--voltx)}
.sfoot{margin-top:auto;padding:14px 10px 0;border-top:1px solid var(--linha);font-size:12px;color:var(--cinza)}
.scrim{display:none}
.main{margin-left:var(--side);min-height:100vh}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:calc(14px + var(--safe-t)) 28px 14px;background:rgba(11,11,12,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--linha)}
.burger{display:none;border:1px solid var(--linha);background:var(--card);border-radius:12px;width:40px;height:40px;align-items:center;justify-content:center;cursor:pointer}
.gsearch{position:relative;flex:1;max-width:520px}
.gsearch input{width:100%;background:var(--card);border:1px solid var(--linha);border-radius:999px;padding:10px 14px 10px 38px;font-size:13.5px;min-height:40px}
.gsearch svg{position:absolute;left:13px;top:11px;color:var(--cinza);width:17px;height:17px}
.gres{position:absolute;left:0;right:0;top:46px;background:var(--card2);border:1px solid var(--linha2);border-radius:14px;padding:6px;box-shadow:0 20px 40px rgba(0,0,0,.5);max-height:60vh;overflow-y:auto}
.gres button{display:flex;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:9px 10px;cursor:pointer}
.gres button:hover{background:var(--card)}
.gres .k{font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--cinza);text-transform:uppercase;width:72px;flex:0 0 auto;padding-top:2px}
.tright{margin-left:auto;display:flex;align-items:center;gap:8px}
.chipbtn{border:1px solid var(--linha);background:var(--card);border-radius:999px;padding:8px 12px;font-weight:600;font-size:12.5px;min-height:38px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.bell{position:relative;width:40px;height:40px;border-radius:999px;border:1px solid var(--linha);background:var(--card);display:flex;align-items:center;justify-content:center;cursor:pointer}
.bell .dotn{position:absolute;top:-3px;right:-3px;background:var(--flash);color:#131411;font-size:10px;font-weight:700;border-radius:999px;padding:1px 5px}
.avatar{display:flex;align-items:center;gap:10px;padding-left:6px}
.avatar .av{width:36px;height:36px;border-radius:999px;background:var(--volt);color:#000;font-weight:800;display:flex;align-items:center;justify-content:center;font-family:var(--fh);font-size:13px}
.avatar .nm{font-weight:700;font-size:13px;line-height:1.2}.avatar .rl{font-size:11px;color:var(--cinza)}
.content{display:grid;grid-template-columns:minmax(0,1fr) var(--rail);gap:22px;padding:22px 28px calc(60px + var(--safe-b))}
.content.norail{grid-template-columns:minmax(0,1fr)}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.pagehead h1{font-size:20px}
.pagehead .sub{font-size:12px;color:var(--cinza);margin-top:4px}
.rail{display:flex;flex-direction:column;gap:14px;min-width:0}
@media(max-width:1379px){.content{grid-template-columns:minmax(0,1fr)}.rail{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}}
@media(max-width:899px){
 .side{transform:translateX(-100%);transition:transform .2s;box-shadow:0 0 40px rgba(0,0,0,.6)}
 .shell.open .side{transform:none}
 .shell.open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:39}
 .main{margin-left:0}
 .burger{display:inline-flex}
 .topbar{padding:calc(10px + var(--safe-t)) 14px 10px}
 .content{padding:16px 14px calc(60px + var(--safe-b));gap:16px}
 .avatar .tx,.hideM{display:none}
 .gsearch{max-width:none}
}
/* ===== blocks ===== */
.panel{background:var(--card);border:1px solid var(--linha);border-radius:18px;padding:16px;min-width:0}
.panel h3{font-size:13.5px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.panel h3 a{font-family:Figtree,system-ui,sans-serif;font-size:12px;font-weight:600;color:var(--cinza);text-decoration:none;cursor:pointer}
.hero{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--linha);border-radius:22px;padding:26px 28px;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:22px;align-items:center}
.hero .kick{font-size:10.5px;font-weight:700;letter-spacing:.2em;color:var(--cinza);text-transform:uppercase}
.hero h2{font-size:30px;line-height:1.08;margin-top:12px;font-weight:800}
.hero h2 em{font-style:normal;color:var(--voltx)}
.hero p{color:var(--cinza);margin:12px 0 0;font-size:13px;max-width:440px}
.hero .stk{position:absolute;right:22px;top:18px;background:var(--flash);color:#131411;font-family:var(--fh);font-weight:800;font-size:12px;padding:6px 12px;border-radius:10px;transform:rotate(-5deg)}
.floor{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.floor .b{border-radius:9px;background:var(--card2);border:1px solid var(--linha);padding:7px 4px;text-align:center;font-size:11px;font-weight:700;color:var(--grafite)}
.floor .b.on{background:var(--flash);border-color:var(--flash);color:#131411}
.floor .b.v{background:var(--volt);border-color:var(--volt);color:#000}
.floorlg{display:flex;gap:12px;font-size:11px;color:var(--cinza);margin-top:10px;flex-wrap:wrap}
.floorlg i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px}
@media(max-width:760px){.hero{grid-template-columns:1fr;padding:20px}.hero h2{font-size:24px}}
.stages{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:14px}
@media(max-width:900px){.stages{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stage{background:var(--card);border:1px solid var(--linha);border-radius:16px;padding:14px 16px;cursor:pointer;min-width:0}
.stage:hover{border-color:var(--linha2)}
.stage .h{display:flex;align-items:center;gap:8px;font-weight:600;font-size:12.5px;color:var(--cinza)}
.stage .n{font-family:var(--fh);font-weight:700;font-size:clamp(16px,1.5vw,22px);margin-top:8px;display:flex;align-items:baseline;gap:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stage .n small{font-family:Figtree,system-ui,sans-serif;font-size:11.5px;font-weight:600;color:var(--cinza)}
.stage.v{background:var(--volt);color:#000;border-color:var(--volt)}.stage.v .h,.stage.v small{color:#2a3300}
.stage.c{background:var(--cobalt);border-color:var(--cobalt)}.stage.c .h,.stage.c small{color:#dfe2ff}
.grid{display:grid;gap:10px}
.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.card{background:var(--card);border:1px solid var(--linha);border-radius:16px;padding:14px;min-width:0}
.kpi .n{font-family:var(--fh);font-weight:700;font-size:clamp(15px,1.7vw,19px);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .l{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--cinza)}
.kpi.cob{background:var(--cobalt);border-color:var(--cobalt)}.kpi.cob .l{color:#dfe2ff}
.kpi.vol{background:var(--volt);color:#000;border-color:var(--volt)}.kpi.vol .l{color:#2a3300}
.sec{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:20px 0 10px;flex-wrap:wrap}
.sec h2{font-size:14px}
.muted{color:var(--cinza)}.small{font-size:11.5px}
.pos{color:var(--ok)}.neg{color:var(--bad)}
/* toolbar + filters */
.tool{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.tool .q{position:relative;flex:1 1 220px;max-width:340px}
.tool .q input{width:100%;background:var(--card);border:1px solid var(--linha);border-radius:999px;padding:9px 12px 9px 34px;min-height:38px;font-size:13px}
.tool .q svg{position:absolute;left:11px;top:10px;width:16px;height:16px;color:var(--cinza)}
.tool select{background:var(--card);border:1px solid var(--linha);border-radius:999px;padding:8px 12px;min-height:38px;font-size:12.5px;max-width:200px}
.tool select.on{border-color:var(--volt);color:var(--voltx)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chips button{border:1px solid var(--linha);background:transparent;border-radius:999px;padding:7px 12px;font-size:12.5px;font-weight:600;min-height:34px;cursor:pointer;color:var(--chalk)}
.chips button .c{color:var(--cinza);margin-left:4px;font-weight:600}
.chips button.on{background:var(--volt);color:#000;border-color:var(--volt)}
.chips button.on .c{color:#2a3300}
/* table */
.tblw{background:var(--card);border:1px solid var(--linha);border-radius:18px;overflow-x:auto}
@media(min-width:761px){td[data-l=Quando],td[data-l=Data]{white-space:nowrap}}
table.tb{width:100%;border-collapse:collapse}
table.tb th{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--cinza);text-align:left;padding:12px 14px;border-bottom:1px solid var(--linha);white-space:nowrap}
table.tb td{padding:12px 14px;border-bottom:1px solid var(--linha);vertical-align:middle;font-size:13px}
table.tb tr:last-child td{border-bottom:0}
table.tb tbody tr{cursor:pointer}
table.tb tbody tr:hover{background:var(--card2)}
table.tb .t{font-weight:700}
table.tb .s{font-size:11.5px;color:var(--cinza);margin-top:2px}
table.tb .r{text-align:right;white-space:nowrap;font-weight:700}
.tfoot{display:flex;justify-content:space-between;padding:10px 14px;font-size:12px;color:var(--cinza);border-top:1px solid var(--linha);background:var(--bg2)}
@media(max-width:760px){
 table.tb thead{display:none}
 table.tb,table.tb tbody,table.tb tr,table.tb td{display:block;width:100%}
 table.tb tr{padding:12px 14px;border-bottom:1px solid var(--linha)}
 table.tb td{border:0;padding:3px 0}
 table.tb td[data-l]:not(.m0)::before{content:attr(data-l);display:inline-block;min-width:86px;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--grafite)}
 table.tb .r{text-align:left}
 table.tb td.hm{display:none}
}
.dots{display:flex;align-items:flex-start;gap:0}
.dots .st{display:flex;flex-direction:column;align-items:center;width:48px;position:relative;font-size:9.5px;color:var(--grafite);text-align:center}
.dots .st::before{content:"";position:absolute;top:5px;left:-24px;width:48px;height:2px;background:var(--linha2);z-index:0}
.dots .st:first-child::before{display:none}
.dots .st i{width:12px;height:12px;border-radius:99px;border:2px solid var(--linha2);background:var(--card);position:relative;z-index:1;margin-bottom:4px}
.dots .st.ok i{background:var(--volt);border-color:var(--volt)}
.dots .st.ok::before{background:var(--volt)}
.dots .st.ok{color:var(--chalk)}
.dots .st.cur i{box-shadow:0 0 0 4px rgba(212,255,47,.18)}
.dots .st.x i{background:var(--bad);border-color:var(--bad)}
/* rail */
.tl{display:flex;flex-direction:column;gap:10px}
.tl .e{display:grid;grid-template-columns:46px 10px minmax(0,1fr);gap:10px;align-items:start;cursor:pointer}
.tl .e .h{font-family:var(--fh);font-size:12px;color:var(--cinza);padding-top:1px}
.tl .e .d{width:10px;height:10px;border-radius:99px;background:var(--volt);margin-top:4px}
.tl .e .d.f{background:var(--flash)}
.tl .e b{display:block;font-size:13px}

.pch.tgl{padding:10px 16px;font-size:13px}.sbox{background:var(--bg2);border:1px solid var(--linha);border-radius:14px;padding:12px;margin-top:10px}.sbox .lb{display:block;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--cinza);margin-bottom:8px}
@media(max-width:760px){.dthr{grid-template-columns:1fr}}
textarea.ta{width:100%;box-sizing:border-box;background:var(--card);border:1px solid var(--linha2);border-radius:12px;color:var(--chalk);font:inherit;padding:10px 12px;margin-top:10px}
.eqprev{max-height:220px;overflow:auto;margin-top:8px;font-size:12.5px;display:flex;flex-direction:column;gap:4px}
.side>*{flex-shrink:0}.sitem{flex-shrink:0}
.sitem .sl small{display:none}.sitem{min-height:34px;padding:5px 12px;margin-bottom:1px}.sitem .sl b{font-size:13.5px}.sgrp{margin-top:10px}
.pg,.ctr{--voltx:var(--volt)}
html[data-tema=hibisco]{--volt:#EF8FC4;--flash:#D5FF3F}
html[data-tema=ameixa]{--noite:#12070F;--bg2:#1A0C16;--card:#231521;--card2:#2D1B2A;--linha:#3A2536;--linha2:#4A3045;--volt:#D5FF3F;--flash:#EF8FC4}
html[data-tema=oliva]{--noite:#0B0D07;--bg2:#12150D;--card:#191D12;--card2:#21261A;--linha:#2B3122;--linha2:#3A4230;--volt:#C9DB82;--flash:#EF8FC4}
html[data-tema=papel]{--noite:#F3F3EC;--bg2:#EAEAE1;--card:#FFFFFF;--card2:#F1F1EA;--linha:#DADAD0;--linha2:#C6C6BA;--chalk:#131411;--cinza:#5B5C56;--grafite:#8A8B84;--volt:#D5FF3F;--voltx:#561D45;--flash:#B8327A;color-scheme:light}
html[data-tema=papel] .sheet{background:rgba(19,20,17,.6)}html[data-tema=papel] .tag.o{background:#e3f5e6;color:#1b6b2c;border-color:#bfe5c6}html[data-tema=papel] .tag.w{background:#fff1d6;color:#8a5a00;border-color:#f2d89c}html[data-tema=papel] .tag.x{background:#fde3e6;color:#a1202f;border-color:#f5bcc4}
html[data-tema=papel] .warnbox{background:#fff1d6;color:#7a4f00;border-color:#f2d89c}html[data-tema=papel] .okbox{background:#e3f5e6;color:#1b6b2c;border-color:#bfe5c6}
.temas{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:12px}.tema{border:2px solid var(--linha);border-radius:16px;padding:10px;cursor:pointer;background:var(--card);text-align:left;color:var(--chalk);font:inherit}.tema.on{border-color:var(--voltx)}
.tema .sw{height:54px;border-radius:10px;display:flex;align-items:flex-end;gap:5px;padding:7px;margin-bottom:8px}.tema .sw i{width:16px;height:16px;border-radius:99px;display:block}.tema b{font-size:13px}.tema small{display:block;font-size:11px;color:var(--cinza)}
html[data-tema=papel] :is(.railv,.kpi.cob,.stage.c,.mk.c){--voltx:#D5FF3F;--chalk:#F3F3EC;--cinza:#d9c9d4;color:#F3F3EC}
.sfoot .btn{white-space:nowrap}
details.adv{margin-top:8px}details.adv summary{cursor:pointer;font-size:12.5px;color:var(--cinza);padding:6px 0}

/* ---------- utilidades ---------- */
function $(s,r=document){return r.querySelector(s)}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function brl(v){return (Number(v)||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"})}
function num(v){if(v===null||v===undefined||v==="")return null;const n=Number(String(v).replace(/\./g,"").replace(",","."));return isNaN(n)?null:n}
function numIn(v){return v===null||v===undefined?"":String(v).replace(".",",")}
const DS=["dom","seg","ter","qua","qui","sex","sáb"],DL=["domingo","segunda","terça","quarta","quinta","sexta","sábado"];

function mondayOf(d){const x=new Date(d);x.setHours(0,0,0,0);const w=(x.getDay()+6)%7;x.setDate(x.getDate()-w);return x}
function monthKey(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")}
function ymd(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function parseYmd(s){if(!s)return null;const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)}
function sameDay(a,b){return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate()}
function dExt(d){if(!d)return"";d=typeof d==="string"&&d.length===10?parseYmd(d):new Date(d);return DL[d.getDay()]+", "+d.getDate()+" de "+ML[d.getMonth()]}
function dCurta(d){if(!d)return"—";d=typeof d==="string"&&d.length===10?parseYmd(d):new Date(d);return DS[d.getDay()]+" "+d.getDate()+"/"+MS[d.getMonth()]}
function hm(d){d=new Date(d);return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")}
function horas(a,b){const h=(new Date(b)-new Date(a))/36e5;return (Math.round(h*10)/10).toString().replace(".",",")+" h"}
function jn(n){return "L-"+String(n||0).padStart(4,"0")}

function dLong(v){if(!v)return"";const d=parseYmd(v);return DL[d.getDay()]+", "+d.getDate()+" de "+ML[d.getMonth()]+" de "+d.getFullYear()}
function dateFld(name,label,val,req){const ref=val?parseYmd(val):new Date();return `<div class="fld"><label>${label}</label><input type="hidden" name="${name}" value="${val||""}"><div class="dsel ${val?"":"vazio"}" data-dsel="${name}"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg><span>${val?dLong(val):"Toque no dia abaixo"}</span></div><div class="cal" data-cal="${name}" data-m="${ymd(ref)}">${calHtml(name,ref,val||"")}</div></div>`}
function espSeg(val){const G=[["E","Economy"],["P","Premium"],["B","Business"],["C","Cabine"]];return `<input type="hidden" name="espaco" value="${esc(val||"")}"><div class="espg" data-seg="espaco">${G.map(([k,l])=>`<div class="erow"><span class="elab">${l}</span><div class="ebtns">${ESPACOS.filter(e=>e[0]===k).map(e=>`<button type="button" data-v="${e}" class="${e===val?"on":""}">${e}</button>`).join("")}</div></div>`).join("")}</div>`}
function calHtml(name,ref,sel){const today=new Date();
  const first=new Date(ref.getFullYear(),ref.getMonth(),1);const start=new Date(first);start.setDate(1-first.getDay());
  const jobsDia={};S.jobs.forEach(j=>{if(j.status==="cancelado")return;const k=ymd(new Date(j.inicio));jobsDia[k]=(jobsDia[k]||0)+1});
  let cells="";for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const k=ymd(d);
    cells+=`<button type="button" class="cd ${d.getMonth()!==ref.getMonth()?"out":""} ${sameDay(d,today)?"hj":""} ${k===sel?"sel":""}" data-act="calPick" data-n="${name}" data-v="${k}">${d.getDate()}${jobsDia[k]?`<i>${jobsDia[k]}</i>`:""}</button>`}
  return `<div class="ch"><button type="button" data-act="calNav" data-n="${name}" data-m="-1">‹</button><b>${ML[ref.getMonth()]} ${ref.getFullYear()}</b><button type="button" data-act="calNav" data-n="${name}" data-m="1">›</button></div>
  <div class="cw">${["dom","seg","ter","qua","qui","sex","sáb"].map(x=>`<span>${x}</span>`).join("")}</div><div class="cg">${cells}</div>
  <div class="cf"><button type="button" data-act="calPick" data-n="${name}" data-v="${ymd(today)}">Hoje</button><button type="button" data-act="calPick" data-n="${name}" data-v="${ymd(new Date(Date.now()+864e5))}">Amanhã</button><button type="button" data-act="calPick" data-n="${name}" data-v="">Limpar</button><span class="muted">número rosa = lives no dia</span></div>`}
function calShow(name,ref){const c=$(`#sheetIn [data-cal="${name}"]`);const v=$(`#sheetIn [name="${name}"]`).value;c.dataset.m=ymd(ref);c.innerHTML=calHtml(name,ref,v);c.hidden=false}
document.addEventListener("click",e=>{const a=e.target.closest("[data-act]");if(!a)return;const n=a.dataset.n;
  if(a.dataset.act==="calOpen"){e.stopImmediatePropagation();const c=$(`#sheetIn [data-cal="${n}"]`);const open=!c.hidden;document.querySelectorAll("#sheetIn .cal").forEach(x=>x.hidden=true);if(open)return;const v=$(`#sheetIn [name="${n}"]`).value;calShow(n,v?parseYmd(v):new Date())}
  else if(a.dataset.act==="calNav"){e.stopImmediatePropagation();const c=$(`#sheetIn [data-cal="${n}"]`);const r=parseYmd(c.dataset.m);r.setDate(1);r.setMonth(r.getMonth()+Number(a.dataset.m));calShow(n,r)}
  else if(a.dataset.act==="calPick"){e.stopImmediatePropagation();const inp=$(`#sheetIn [name="${n}"]`);inp.value=a.dataset.v;const b=$(`#sheetIn [data-dsel="${n}"]`);b.querySelector("span").textContent=a.dataset.v?dLong(a.dataset.v):"Toque no dia abaixo";b.classList.toggle("vazio",!a.dataset.v);calShow(n,a.dataset.v?parseYmd(a.dataset.v):parseYmd($(`#sheetIn [data-cal="${n}"]`).dataset.m));inp.dispatchEvent(new Event("change",{bubbles:true}))}
},true);

function moneyFld(name,label,val){return `<div class="fld"><label>${label}</label><input inputmode="decimal" name="${name}" value="${esc(numIn(val))}" placeholder="0,00"></div>`}

async function run(p,okMsg){const {data,error}=await p;if(error){console.warn(error);toast(traduz(error.message),true);throw error}if(okMsg)toast(okMsg);return data}
function traduz(m){m=m||"";if(/row-level security/i.test(m)){const t=(m.match(/table "([^"]+)"/)||[])[1]||"";return"Sem permissão no banco"+(t?" ("+t+")":"")+". Rode o SQL de correção ou fale com um sócio.";}if(/Failed to fetch|network/i.test(m))return"Sem conexão. Tente de novo.";return m}

/* ---------- dados ---------- */
async function loadAll(){
  const q=(t,o="created_at",asc=false)=>db.from(t).select("*").order(o,{ascending:asc});
  const [m,c,p,j,f,a]=await Promise.all([q("imp_membros","nome",true),q("imp_clientes","marca",true),q("imp_propostas","numero"),q("imp_jobs","inicio",true),q("imp_fin"),q("imp_amostras","data")]);
  for(const r of [m,c,p,j,f,a]) if(r.error){console.warn(r.error)}
  S.membros=m.data||[];S.clientes=c.data||[];S.propostas=p.data||[];S.jobs=j.data||[];S.fin=f.data||[];S.amostras=a.data||[];
}
async function refresh(){if(!S.me)return;try{await loadAll();if($("#sheet").hidden&&$("#doc").hidden)render()}catch(e){console.warn(e)}}

/* ---------- login ---------- */
function renderLogin(msg){
  $("#app").innerHTML=`<div class="login"><div style="text-align:center;margin-bottom:22px"><img class="logoimg big" src="${LOGO_LIMA}" alt="IMPlay"><div class="live" style="margin-top:14px">● ERP · gestão de live commerce</div></div>
  <form class="card" id="lf"><div class="fld" style="margin-top:0"><label>E-mail</label><input type="email" name="email" autocomplete="username" required></div>
  <div class="fld"><label>Senha</label><input type="password" name="senha" autocomplete="current-password" required minlength="6"></div>
  ${msg?`<div class="warnbox">${esc(msg)}</div>`:""}
  <div class="row" style="margin-top:18px"><button class="btn p" style="flex:1">Entrar</button><button type="button" class="btn" id="criar">Criar conta</button></div>
  <div class="hint">Use o mesmo e-mail e senha da Agenda. Sócios e equipe entram aqui. Sellers usam o app do seller.</div></form></div>`;
  $("#lf").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);
    const {error}=await db.auth.signInWithPassword({email:f.get("email"),password:f.get("senha")});
    if(error)return renderLogin("Não entrou: "+(error.message.includes("Invalid")?"e-mail ou senha errados.":error.message));boot()};
  $("#criar").onclick=async()=>{const f=new FormData($("#lf"));if(!f.get("email")||String(f.get("senha")).length<6)return toast("Preencha e-mail e senha (mín. 6)",true);
    const {error}=await db.auth.signUp({email:f.get("email"),password:f.get("senha")});if(error)return renderLogin(error.message);boot()};
}
async function boot(){
  const {data:{session}}=await db.auth.getSession();
  if(!session)return renderLogin();
  const {data:me,error}=await db.rpc("imp_entrar",{p_app:"erp"});
  if(error){return renderLogin("Erro ao entrar: "+error.message+" (o SQL da Implay já foi rodado no Supabase?)")}
  if(!me||!me.id||me.papel==="seller"||me.status!=="ativo"){
    $("#app").innerHTML=`<div class="login"><div class="card"><h3>Sem acesso ao ERP</h3><p class="muted">Seu e-mail <b>${esc(session.user.email)}</b> ${me&&me.papel==="seller"?"está cadastrado como seller. Use o app do seller.":"ainda não foi liberado. Peça a um sócio para te cadastrar em Equipe com este e-mail."}</p><button class="btn" id="sair">Sair</button></div></div>`;
    $("#sair").onclick=async()=>{await db.auth.signOut();renderLogin()};return}
  S.me=me;S.email=session.user.email;await loadAll();render();
}

function finAberto(tipo){return S.fin.filter(f=>f.status==="ativo"&&f.tipo===tipo&&!f.pago_em)}
function soma(arr){return arr.reduce((s,f)=>s+(Number(f.valor)||0),0)}
function aporteInfo(){
  const ap=S.fin.filter(f=>f.status==="ativo"&&f.categoria==="aporte"&&f.pago_em);
  const dev=S.fin.filter(f=>f.status==="ativo"&&f.categoria==="devolucao_aporte"&&f.pago_em);
  const tot=soma(ap),dv=soma(dev);
  let prazo=null;ap.forEach(a=>{const d=parseYmd(a.pago_em);d.setMonth(d.getMonth()+18);if(!prazo||d<prazo)prazo=d});
  return {tot,dv,saldo:tot-dv,prazo,ap}
}
const VIEWS={};
/* ================= AGENDA ================= */
function conflitos(lista){
  const out=[];const ab=lista.filter(j=>j.status!=="cancelado");
  for(let i=0;i<ab.length;i++)for(let k=i+1;k<ab.length;k++){const a=ab[i],b=ab[k];
    if(new Date(a.inicio)<new Date(b.fim)&&new Date(b.inicio)<new Date(a.fim)){
      if(a.local_tipo==="estudio"&&b.local_tipo==="estudio"&&a.espaco&&a.espaco===b.espaco)out.push(`Espaço ${a.espaco}: ${jn(a.numero)} e ${jn(b.numero)} no mesmo horário`);
      const pa=[a.principal_id,a.substituto_id].filter(Boolean),pb=[b.principal_id,b.substituto_id].filter(Boolean);
      pa.filter(x=>pb.includes(x)).forEach(x=>out.push(`${nome(x)} está em ${jn(a.numero)} e ${jn(b.numero)} ao mesmo tempo`));
    }}
  return out;
}
function jobCard(j){const open=!j.principal_id&&j.status==="aberto";
  return `<div class="jc ${j.status==="realizado"?"done":open?"open":""}" data-act="job" data-id="${j.id}"><b>${hm(j.inicio)}–${hm(j.fim)}</b> · ${esc(j.marca||cliNome(j.cliente_id)||"")}<br>
  <span class="muted">${j.local_tipo==="estudio"?(j.espaco||"estúdio"):j.local_tipo==="cliente"?"local do cliente":"online"}</span><br>
  ${j.principal_id?`A: ${esc(nome(j.principal_id))}`:`<span style="color:var(--flash)">A: vaga aberta</span>`}${j.substituto_id?` · B: ${esc(nome(j.substituto_id))}`:""}</div>`}
VIEWS.agenda=()=>{
  const today=new Date();
  const head=`<div class="row" style="justify-content:space-between;margin-bottom:12px">
    <div class="pills" style="margin:0"><button data-act="agView" data-v="semana" class="${S.agView==="semana"?"on":""}">Semana</button><button data-act="agView" data-v="mes" class="${S.agView==="mes"?"on":""}">Mês</button></div>
    <div class="row"><button class="btn sm" data-act="agNav" data-v="-1">‹</button><button class="btn sm" data-act="agHoje">hoje</button><button class="btn sm" data-act="agNav" data-v="1">›</button><button class="btn p sm" data-act="novoJob">+ Nova live</button></div></div>`;
  if(S.agView==="mes"){
    if(!S.agMes){const n=new Date();S.agMes=new Date(n.getFullYear(),n.getMonth(),1)}const ref=S.agMes;const first=new Date(ref.getFullYear(),ref.getMonth(),1);const start=mondayOf(first);
    let cells="";for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);
      const js=S.jobs.filter(j=>j.status!=="cancelado"&&sameDay(new Date(j.inicio),d));
      js.sort((a,b)=>a.inicio<b.inicio?-1:1);
      cells+=`<div class="md ${d.getMonth()!==ref.getMonth()?"out":""} ${sameDay(d,today)?"today":""} ${d<new Date(today.toDateString())?"past":""}"><div class="mdh"><b data-act="agDia" data-v="${ymd(d)}" title="Ver a semana">${d.getDate()}</b><button class="madd" data-act="novoJobDia" data-v="${ymd(d)}" title="Nova live neste dia">+</button></div>
      ${js.slice(0,3).map(j=>`<div class="mj ${!j.principal_id&&j.status==="aberto"?"open":""} ${j.status==="realizado"?"done":""}" data-act="job" data-id="${j.id}"><b>${hm(j.inicio)}</b> ${esc(j.marca||cliNome(j.cliente_id)||"Live")}${j.espaco?` <span>${j.espaco}</span>`:""}</div>`).join("")}${js.length>3?`<div class="mmore" data-act="agDia" data-v="${ymd(d)}">+${js.length-3} mais</div>`:""}</div>`}
    const mjs=S.jobs.filter(j=>j.status!=="cancelado"&&new Date(j.inicio).getMonth()===ref.getMonth()&&new Date(j.inicio).getFullYear()===ref.getFullYear());
    return head+`<div class="row" style="justify-content:space-between;margin-bottom:10px"><h2 style="font-size:20px;text-transform:capitalize">${ML[ref.getMonth()]} ${ref.getFullYear()}</h2><span class="muted small">${mjs.length} lives no mês · ${mjs.filter(j=>!j.principal_id&&j.status==="aberto").length} vagas abertas · <i class="lg a"></i>com seller <i class="lg b"></i>vaga aberta</span></div><div class="mgrid big">${DS.slice(1).concat(DS[0]).map(d=>`<div class="mwd">${d}</div>`).join("")}${cells}</div>`;
  }
  const days=[...Array(7)].map((_,i)=>{const d=new Date(S.week);d.setDate(d.getDate()+i);return d});
  const fimS=new Date(days[6]);fimS.setHours(23,59,59);
  const wk=S.jobs.filter(j=>j.status!=="cancelado"&&new Date(j.inicio)>=S.week&&new Date(j.inicio)<=fimS);
  const conf=conflitos(wk);
  return head+`<div class="muted small" style="margin-bottom:10px">${dCurta(days[0])} a ${dCurta(days[6])} · ${wk.length} lives · ${wk.filter(j=>!j.principal_id&&j.status==="aberto").length} vagas abertas</div>
  <div class="week">${days.map(d=>{const js=wk.filter(j=>sameDay(new Date(j.inicio),d));const occ=js.filter(j=>j.local_tipo==="estudio"&&j.espaco).map(j=>j.espaco);
   return `<div class="day ${sameDay(d,today)?"today":""}"><div class="dh"><span class="small muted">${DS[d.getDay()].toUpperCase()}</span><b>${d.getDate()}</b></div>
   ${js.length?js.map(jobCard).join(""):`<div class="small muted">livre</div>`}
   ${occ.length?`<div class="small muted" style="margin-top:6px">${new Set(occ).size}/${ESPACOS.length} espaços</div>`:""}</div>`}).join("")}</div>
  <div class="${conf.length?"warnbox":"okbox"}" style="margin-top:12px">${conf.length?conf.map(esc).join("<br>"):"✓ Sem conflito de espaço ou de seller nesta semana"}</div>`;
};

function pickM(name,label,val,opts,o={}){const cur=String(val||"").split(" + ").map(x=>x.trim()).filter(Boolean);
  return `<div class="fld pick" data-pickm="${name}">${label?`<label>${label}</label>`:""}<div class="pchips">${opts.map(x=>`<button type="button" class="pch ${cur.includes(x)?"on":""}" data-act="pickMSet" data-v="${esc(x)}">${cur.includes(x)?"✓ ":""}${esc(x)}</button>`).join("")}</div>
  <input name="${name}" value="${esc(cur.join(" + "))}" placeholder="${esc(o.ph||"Outro: escreva aqui")}" class="pin2"></div>`}
function pickMSync(box){const cur=box.querySelector("input").value.split("+").map(x=>x.trim());box.querySelectorAll(".pch").forEach(b=>{const on=cur.includes(b.dataset.v);b.classList.toggle("on",on);b.textContent=(on?"✓ ":"")+b.dataset.v})}
document.addEventListener("click",e=>{const b=e.target.closest("[data-act=pickMSet]");if(!b)return;e.stopImmediatePropagation();const box=b.closest("[data-pickm]");const i=box.querySelector("input");
  let cur=i.value.split("+").map(x=>x.trim()).filter(Boolean);const v=b.dataset.v;cur=cur.includes(v)?cur.filter(x=>x!==v):[...cur,v];i.value=cur.join(" + ");pickMSync(box);S_dirty=true},true);

function combine(dateStr,h,m){const d=parseYmd(dateStr);d.setHours(Number(h),Number(m),0,0);return d}
async function saveJob(id){
  const f=formData();if(!f.data)return toast("Escolha a data",true);
  const nh=num(f.horas);if(!f.hora)return toast("Escolha a hora de início",true);if(!nh||nh<=0)return toast("Diga quantas horas a live vai durar",true);const ini=combine(f.data,f.hora,0);const fim=new Date(ini.getTime()+nh*36e5);
  const srv=f.modalidade==="servico",app=srv&&!!f.seller_app,conv=srv&&!!f.seller_conv,fora=app||conv,clt=srv&&!!f.seller_clt;if(app&&!num(f.valor_seller))return toast("Informe o cachê da vaga no app",true);if(f.local_tipo==="cliente"&&!f.local_endereco)return toast("Escreva onde é a live (terceiros)",true);
  const row={proposta_id:f.proposta_id||null,cliente_id:f.cliente_id||null,marca:f.marca||cliNome(f.cliente_id)||null,equipamento:srv?(f.equipamento||null):null,seller_clt:clt,seller_fora:fora,clt_ids:clt&&f.clt_ids?f.clt_ids.split(","):[],convidados:conv?(f.convidados||null):null,modalidade:f.modalidade,local_tipo:f.local_tipo,
    espaco:f.local_tipo==="estudio"?(f.espaco||null):null,local_endereco:f.local_tipo==="cliente"?f.local_endereco||null:null,inicio:ini.toISOString(),fim:fim.toISOString(),
    valor_seller:app?num(f.valor_seller):null,seller_pago_por:f.seller_pago_por||"cliente",requisitos:app?(f.requisitos||null):null,publicado:app,
    principal_id:app?(f.principal_id||null):null,substituto_id:app?(f.substituto_id||null):null,obs:f.obs||null};
  if(row.principal_id&&row.principal_id===row.substituto_id)return toast("Principal e substituto precisam ser pessoas diferentes",true);
  if(id&&f.ireal_h!==undefined){const j=S.jobs.find(x=>x.id===id);const base=ymd(new Date(j.inicio));
    let ir=combine(f.data||base,f.ireal_h,f.ireal_m),fr=combine(f.data||base,f.freal_h,f.freal_m);if(fr<=ir)fr=new Date(fr.getTime()+864e5);
    row.inicio_real=ir.toISOString();row.fim_real=fr.toISOString();row.gmv=num(f.gmv);row.pedidos=f.pedidos?Number(f.pedidos):null}
  const others=S.jobs.filter(x=>x.id!==id&&x.status!=="cancelado");
  const c=conflitos([...others,Object.assign({id:"novo",numero:0},row)]).filter(s=>s.includes("L-0000"));
  if(id)await run(db.from("imp_jobs").update(row).eq("id",id),"Live salva");
  else await run(db.from("imp_jobs").insert(row),"Live criada");
  if(c.length)toast("Atenção: "+c[0].replace("L-0000","esta live"),true);
  closeSheet();await refresh();
}

function evTxt(e){let t=EV_LAB[e.tipo]||e.tipo;const d=e.detalhe||{};
  if(e.tipo==="cancelou")t+=` (${d.vaga||""}, ${d.prazo==="no_prazo"?"no prazo, sem prejuízo":"menos de 24h antes"}${d.motivo?" · motivo: "+d.motivo:""})`;
  if(e.tipo==="condicoes_alteradas"&&d.antes&&d.depois){const ch=[];if(d.antes.valor_seller!==d.depois.valor_seller)ch.push(`cachê ${brl(d.antes.valor_seller)} → ${brl(d.depois.valor_seller)}`);if(d.antes.inicio!==d.depois.inicio)ch.push(`horário ${dCurta(d.antes.inicio)} ${hm(d.antes.inicio)} → ${dCurta(d.depois.inicio)} ${hm(d.depois.inicio)}`);if(d.antes.publicado!==d.depois.publicado)ch.push(d.depois.publicado?"publicado no mural":"tirado do mural");if(ch.length)t+=": "+ch.join(" · ")}

  let saved;
  if(id)saved=await run(db.from("imp_propostas").update(row).eq("id",id).select().single(),silent?null:"Proposta salva");
  else saved=await run(db.from("imp_propostas").insert(row).select().single(),silent?null:"Proposta criada");
  if(saved&&row.status==="aceita"&&!saved.contrato_numero){saved=await run(db.from("imp_propostas").update({contrato_numero:"C-"+String(saved.numero).padStart(4,"0")}).eq("id",saved.id).select().single(),"Virou contrato "+"C-"+String(saved.numero).padStart(4,"0"))}
  await loadAll();return saved;
}

function compress(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const k=Math.min(1,1100/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext("2d").drawImage(img,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.6))};img.onerror=rej;img.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}
async function saveFin(id){
  const f=formData();const valor=num(f.valor);if(!valor)return toast("Informe o valor",true);
  const cat=f.tipo==="entrada"?f.cat_e:f.cat_s;if(!cat)return toast("Escolha a categoria",true);
  const row={tipo:f.tipo,categoria:cat,natureza:f.tipo==="saida"?(f.natureza||null):null,valor,descricao:f.descricao||null,contraparte:f.contraparte||null,vencimento:f.vencimento||null,pago_em:f.pago_em||null,
    forma:f.forma||null,job_id:f.job_id||null,proposta_id:f.proposta_id||null,nf_numero:f.nf_numero||null,pago_por:f.tipo==="saida"?f.pago_por:"empresa"};
  const old=id?S.fin.find(x=>x.id===id):null;
  if(row.pago_por==="proprio"){row.reembolso=old&&!["nao","solicitado"].includes(old.reembolso)?old.reembolso:(f.reembolso||"solicitado");if(!old||!old.reembolso_para)row.reembolso_para=S.me.id}else if(!old||["nao","solicitado"].includes(old.reembolso)){row.reembolso="nao"}
  if(!row.pago_em&&row.pago_por==="proprio")row.pago_em=ymd(new Date());
  const fileIn=$("#sheetIn [data-foto]");let foto=null;if(fileIn&&fileIn.files[0]){try{foto=await compress(fileIn.files[0]);row.tem_comprovante=true}catch(e){toast("Não consegui ler a foto",true)}}
  let saved;
  if(id)saved=await run(db.from("imp_fin").update(row).eq("id",id).select().single(),"Salvo");
  else saved=await run(db.from("imp_fin").insert(row).select().single(),row.reembolso==="solicitado"?"Reembolso solicitado":"Lançado");
  if(foto&&saved){const ex=old&&old.tem_comprovante;await run(ex?db.from("imp_anexos").update({imagem:foto}).eq("fin_id",saved.id):db.from("imp_anexos").insert({fin_id:saved.id,imagem:foto}))}
  closeSheet();await refresh();
}

function propSteps(p){const jobs=S.jobs.filter(j=>j.proposta_id===p.id);const fat=S.fin.some(x=>x.proposta_id===p.id&&x.tipo==="entrada"&&x.status==="ativo");

/* ---------- utilidades de período ---------- */
function rangeOf(per){const n=new Date();let a,b=new Date(n.getFullYear(),n.getMonth()+1,1);
  if(per==="mes")a=new Date(n.getFullYear(),n.getMonth(),1);
  else if(per==="mesant"){a=new Date(n.getFullYear(),n.getMonth()-1,1);b=new Date(n.getFullYear(),n.getMonth(),1)}
  else if(per==="tri")a=new Date(n.getFullYear(),n.getMonth()-2,1);
  else if(per==="ano")a=new Date(n.getFullYear(),0,1);
  else a=new Date(2000,0,1);return [a,b]}
const PER_LAB={mes:"Este mês",mesant:"Mês passado",tri:"Últimos 3 meses",ano:"Este ano",tudo:"Tudo"};
function inR(d,[a,b]){if(!d)return false;d=typeof d==="string"&&d.length===10?parseYmd(d):new Date(d);return d>=a&&d<b}
function hrs(j){return Math.max(0,(new Date(j.fim_real||j.fim)-new Date(j.inicio_real||j.inicio))/36e5)}
function nf(n,d=0){return (Number(n)||0).toLocaleString("pt-BR",{maximumFractionDigits:d,minimumFractionDigits:d})}
function brlK(v){v=Number(v)||0;return Math.abs(v)>=1e6?"R$ "+nf(v/1e6,1)+" mi":Math.abs(v)>=1e4?"R$ "+nf(v/1e3,1)+" mil":brl(v)}
function bars(arr,fmt=brl,color){const mx=Math.max(1,...arr.map(x=>Math.abs(x[1])));return `<div class="bars">${arr.map(([l,v,sub])=>`<div class="bl"><span title="${esc(l)}">${esc(l)}</span><span class="bt"><i style="width:${Math.max(2,Math.abs(v)/mx*100)}%;${color?"background:"+color:""}"></i></span><span>${fmt(v)}${sub?`<small class="muted" style="display:block;font-weight:500">${sub}</small>`:""}</span></div>`).join("")||`<div class="muted small">Sem dados no período.</div>`}</div>`}
function colsChart(arr,fmt=brlK){const mx=Math.max(1,...arr.map(x=>Math.max(Math.abs(x[1]),Math.abs(x[2]||0))));
  return `<div class="cchart">${arr.map(([l,v,v2])=>`<div class="cc"><div class="ccb"><i class="a" style="height:${Math.abs(v)/mx*100}%" title="${fmt(v)}"></i>${v2!==undefined?`<i class="b" style="height:${Math.abs(v2)/mx*100}%" title="${fmt(v2)}"></i>`:""}</div><div class="ccl">${esc(l)}</div><div class="ccv">${fmt(v)}</div></div>`).join("")}</div>`}
function mini(l,v,sub,cls=""){return `<div class="mk ${cls}"><div class="l">${l}</div><div class="n">${v}</div>${sub?`<div class="s">${sub}</div>`:""}</div>`}
function lastMonths(n){const out=[];const d=new Date();d.setDate(1);for(let i=n-1;i>=0;i--){const x=new Date(d.getFullYear(),d.getMonth()-i,1);out.push([monthKey(x),MS[x.getMonth()]])}return out}

function etapaProp(p){const hoje=new Date(new Date().toDateString());
  if(["recusada","cancelada"].includes(p.status))return "encerrado";
  if(p.status==="rascunho")return "lead";if(p.status==="enviada")return "enviada";
  const fim=p.contrato_fim?parseYmd(p.contrato_fim):null;if(fim&&fim<hoje)return "encerrado";
  if(fim&&(fim-hoje)/864e5<=30)return "renovar";
  const js=S.jobs.filter(j=>j.proposta_id===p.id&&j.status!=="cancelado");if(js.some(j=>new Date(j.inicio)<=new Date()))return "operacao";return "contrato"}

let _pdfjs=null;
function loadPdfJs(){if(_pdfjs)return _pdfjs;_pdfjs=new Promise((ok,er)=>{const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";s.onload=()=>{try{pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";ok(pdfjsLib)}catch(e){er(e)}};s.onerror=er;document.head.appendChild(s)});return _pdfjs}
async function pdfTexto(file){try{const lib=await loadPdfJs();const pdf=await lib.getDocument({data:await file.arrayBuffer()}).promise;let t="";for(let p=1;p<=Math.min(3,pdf.numPages);p++){const pg=await pdf.getPage(p);const c=await pg.getTextContent();t+=c.items.map(i=>i.str).join(" ")+"\n"}return t}catch(e){console.warn("pdf",e);return ""}}

function nomeLimpo(n){return n.replace(/\.[^.]+$/,"").replace(/^[0-9a-f]{6,}[-_ ]/i,"").replace(/[_-]+/g," ").replace(/\s+/g," ").trim().replace(/^./,c=>c.toUpperCase())}
async function docDetectar(file){const nome=file.name;let txt="";
  if(/pdf/.test(file.type)||/\.pdf$/i.test(nome))txt=await pdfTexto(file);
  const alvo=(txt.slice(0,4000)+" "+nome.replace(/[_-]+/g," "));let titulo=null,cat="outro";
  for(const [re,t,c] of DOC_REGRAS){if(re.test(alvo)){titulo=t;cat=c;break}}
  if(!titulo&&!txt.trim()){if(/cnpj/i.test(nome)){titulo="Cartão CNPJ";cat="fiscal"}else if(/acordo|s[oó]cios/i.test(nome)){titulo="Acordo de sócios";cat="societario"}}
  if(!titulo)return {titulo:nomeLimpo(nome),categoria:cat};
  const v=nome.match(/(?:^|[^a-z])V\s?(\d{1,3})(?!\d)/i);if(v&&/Acordo|Contrato/.test(titulo))titulo+=" (V"+v[1]+")";
  if(/assinad|docusign|clicksign/i.test(alvo)&&/Contrato|Acordo|Alteração|Procuração/.test(titulo))titulo+=" assinado";
  const em=txt.match(/Emitido\s+no\s+dia\s+(\d{2}\/\d{2}\/\d{4})/i);if(em&&titulo==="Cartão CNPJ")titulo+=" · emitido em "+em[1];
  return {titulo,categoria:cat}}
async function docSubir(files){files=[...files];if(!files.length)return;
  for(const file of files){const u={nome:file.name,tam:file.size,st:"",msg:"lendo…"};S.upl.unshift(u);uplRefresh();
    if(file.size>50*1048576){u.st="erro";u.msg="maior que 50 MB";uplRefresh();continue}
    try{const d=await docDetectar(file);u.titulo=d.titulo;u.msg="enviando…";uplRefresh();
      const safe=file.name.normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^\w.\-]+/g,"_");const path=`${Date.now().toString(36)}_${Math.random().toString(36).slice(2,7)}/${safe}`;
      const up=await db.storage.from(DOC_BUCKET).upload(path,file,{contentType:file.type||"application/octet-stream",upsert:false});if(up.error)throw up.error;
      const r=await db.from("imp_docs").insert({titulo:d.titulo,categoria:d.categoria,arquivo_nome:file.name,mime:file.type||"application/octet-stream",tamanho:file.size,caminho:path}).select(DOC_COLS).single();
      if(r.error){await db.storage.from(DOC_BUCKET).remove([path]);throw r.error}
      S.docs.unshift(r.data);u.st="ok";u.msg="salvo como “"+d.titulo+"”";uplRefresh();const l=$("#lst");if(l)l.innerHTML=LISTS.doc()}
    catch(e){console.warn(e);u.st="erro";u.msg=/bucket|not found/i.test(e.message||"")?"falta rodar o SQL dos documentos no Supabase":traduz(e.message||String(e));uplRefresh()}}
  if(S.tab==="empresa")render();setTimeout(()=>{S.upl=S.upl.filter(x=>x.st!=="ok");if(S.tab==="empresa"&&$("#sheet").hidden)render()},5000)}

function eqCatAuto(t){t=(t||"").toLowerCase();
  if(/iphone|celular|smartphone|galaxy|xiaomi|motorola|redmi|pixel/.test(t))return "Celular";
  if(/microfone|mic\b|lapela|rode|shure|boya|hollyland|dji mic/.test(t))return "Microfone";
  if(/fone|airpods|headset|earbud|in-?ear|retorno/.test(t))return "Fone de ouvido";
  if(/c[âa]mera|sony|canon|nikon|gopro|webcam|lumix|fujifilm|osmo/.test(t))return "Câmera";
  if(/luz|ring|led|softbox|ilumina|painel|refletor|bast[ãa]o/.test(t))return "Iluminação";
  if(/trip[ée]|suporte|gimbal|bra[çc]o|pedestal|estabilizador/.test(t))return "Tripé / suporte";
  if(/notebook|macbook|ipad|tablet|computador|monitor|pc\b|mac mini|imac/.test(t))return "Computador / tablet";
  if(/cabo|carregador|fonte|hub|adaptador|bateria|power ?bank|extens/.test(t))return "Cabo / carregador";
  if(/cen[áa]rio|fundo|backdrop|m[óo]vel|mesa|cadeira|tapete|prateleira/.test(t))return "Cenário";
  return "Outro"}
function eqLista(){const f=S.f.eqp;let l=S.equip.filter(e=>has(f.q,e.nome,e.marca,e.modelo,e.serie,e.local,e.com_quem,eqn(e.numero),nome(e.responsavel_id)));
  if(f.cat)l=l.filter(e=>e.categoria===f.cat);if(f.loc)l=l.filter(e=>e.local===f.loc);
  if(f.st==="problema")l=l.filter(e=>["Precisa de reparo","Quebrado"].includes(e.estado)||e.status==="Manutenção");
  else if(f.st!=="todos")l=l.filter(e=>e.status===f.st);else l=l.filter(e=>e.status!=="Baixado");return l}

   <td data-l="Categoria">${esc(e.categoria)}</td><td data-l="Qtd." class="r"><b>${e.quantidade||1}</b></td><td data-l="Onde está">${esc(e.local||"—")}${e.com_quem||e.responsavel_id?`<div class="s">com ${esc(e.com_quem||nome(e.responsavel_id))}</div>`:""}</td>
   <td data-l="Estado">${["Precisa de reparo","Quebrado"].includes(e.estado)?`<span class="tag w">${esc(e.estado)}</span>`:esc(e.estado||"—")}</td><td data-l="Situação">${eqTag(e.status)}</td></tr>`),"Nada aqui ainda. Use + Equipamento ou Colar lista para cadastrar tudo de uma vez.")

    case"cliSalvar":{const f=formData();if(!f.marca)return toast("Preencha a marca",true);const row={marca:f.marca,empresa:f.empresa||null,cnpj:f.cnpj||null,contato_nome:f.contato_nome||null,contato_tel:f.contato_tel||null,contato_email:f.contato_email||null,endereco:f.endereco||null,obs:f.obs||null};
      await run(id?db.from("imp_clientes").update(row).eq("id",id):db.from("imp_clientes").insert(row),"Cliente salvo");closeSheet();await refresh();break}
    case"cliCancelar":if(!armed(a))return;await run(db.from("imp_clientes").update({status:"cancelado"}).eq("id",id),"Arquivado");closeSheet();await refresh();break;
    case"finSub":S.finSub=val;render();break;
    case"finF":S.finF=val;render();break;
    case"finMes":if(val==="tudo")S.finMes="tudo";else{const b=S.finMes==="tudo"?new Date():parseYmd(S.finMes+"-01");b.setDate(1);b.setMonth(b.getMonth()+Number(val));S.finMes=monthKey(b)}render();break;
    case"finNovo":{const pre={};if(a.dataset.tipo)pre.tipo=a.dataset.tipo;if(a.dataset.cat)pre.categoria=a.dataset.cat;if(a.dataset.proprio){pre.pago_por="proprio";pre.reembolso="solicitado"}
      if(a.dataset.job){const j=S.jobs.find(x=>x.id===a.dataset.job);pre.job_id=j.id;pre.proposta_id=j.proposta_id;if(pre.tipo==="saida"){pre.categoria="seller";pre.valor=j.valor_seller;pre.contraparte=nome(j.principal_id);pre.descricao="Cachê "+jn(j.numero)}else{pre.categoria="fixo_cliente";pre.contraparte=j.marca;pre.descricao=jn(j.numero)+" · "+(j.marca||"")}}
      closeSheet();openFin(null,pre);break}
    case"fin":openFin(id);break;
    case"finSalvar":await saveFin(id);break;
    case"finCancelar":if(!armed(a))return;await run(db.from("imp_fin").update({status:"cancelado"}).eq("id",id),"Cancelado");closeSheet();await refresh();break;
    case"reemb":{const up={reembolso:val};if(val==="aprovado"){up.aprovado_por=S.me.user_id;up.aprovado_em=new Date().toISOString()}await run(db.from("imp_fin").update(up).eq("id",id),val==="aprovado"?"Reembolso aprovado":val==="pago"?"Reembolso pago":"Reembolso recusado");closeSheet();await refresh();break}
    case"verFoto":{const r=await run(db.from("imp_anexos").select("imagem").eq("fin_id",id).single());$("#fotoPrev").innerHTML=`<img class="thumb" src="${r.imagem}">`;break}
    case"amF":S.amF=val;render();break;
    case"amNova":openAm(null,val);break;
    case"am":openAm(id);break;
    case"qtd":{const i=$("#sheetIn [name=qtd]");i.value=Math.max(1,(parseInt(i.value)||0)+Number(val));break}
    case"amSalvar":{const f=formData();if(!f.produto)return toast("Informe o produto",true);const q=parseInt(f.qtd);if(!q||q<1)return toast("Quantidade inválida",true);
      const row={cliente_id:f.cliente_id||null,marca:cliNome(f.cliente_id)||null,produto:f.produto,movimento:f.movimento,qtd:q,para:f.movimento==="saida"?f.para||null:null,data:f.data||ymd(new Date()),obs:f.obs||null};
      await run(id?db.from("imp_amostras").update(row).eq("id",id):db.from("imp_amostras").insert(row),"Registrado");closeSheet();await refresh();break}
    case"amCancelar":if(!armed(a))return;await run(db.from("imp_amostras").update({status:"cancelado"}).eq("id",id),"Apagado");closeSheet();await refresh();break;
    case"eqF":S.eqF=val;render();break;
    case"membroNovo":openMembro(null);break;
    case"membro":openMembro(id);break;
    case"aprovar":await run(db.from("imp_membros").update({status:"ativo"}).eq("id",id),"Seller aprovado");closeSheet();await refresh();break;
    case"membroSalvar":{const f=formData();if(!f.nome||!f.email)return toast("Nome e e-mail",true);
      const row={nome:f.nome,papel:f.papel,vinculo:f.vinculo,status:f.status,telefone:f.telefone||null,cidade:f.cidade||null,cnpj:f.cnpj||null,pix:f.pix||null,instagram:f.instagram||null,tiktok:f.tiktok||null,comissao_perc:num(f.comissao_perc),obs:f.obs||null};
      if(id)await run(db.from("imp_membros").update(row).eq("id",id),"Salvo");else{row.email=f.email.toLowerCase();await run(db.from("imp_membros").insert(row),"Cadastrado. Ela entra com este e-mail.")}
      closeSheet();await refresh();break}
    case"relatorio":closeSheet();await relatorio(id);break;
  }}catch(err){console.warn(err)}
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.matches("[data-ext]")){const h=$(`[data-ext-for="${t.name}"]`);if(h)h.textContent=t.value?"→ "+dExt(t.value):""}
  if(t.name==="proposta_id"&&t.closest("#sheetIn")&&$("#sheetIn [name=modalidade]")&&$("#sheetIn [name=local_tipo]")){const p=S.propostas.find(x=>x.id===t.value);if(p){$("#sheetIn [name=cliente_id]").value=p.cliente_id||"";$("#sheetIn [name=marca]").value=p.marca||""}}
  if(t.name==="cliente_id"&&t.value==="__novo__"){const b=t.closest(".fld").querySelector(".newcli");b.hidden=false;b.querySelector("#nc_marca").focus();return}
  if(t.name==="cliente_id"&&t.closest("#sheetIn")){const c=S.clientes.find(x=>x.id===t.value);const mk=$("#sheetIn [name=marca]");if(c&&mk&&!mk.value)mk.value=c.marca;const le=$("#sheetIn [name=local_endereco]");if(c&&le&&!le.value)le.value=c.endereco||""}
  if(t.matches("[data-foto]")&&t.files[0]){compress(t.files[0]).then(u=>$("#fotoPrev").innerHTML=`<img class="thumb" src="${u}">`)}
});
document.addEventListener("visibilitychange",()=>{if(!document.hidden)refresh()});
setInterval(refresh,60000);
if(!orcPreviewBoot())boot();
</script>
</body>
</html>
