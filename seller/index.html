<style>
:root{--fh:Inter,system-ui,-apple-system,sans-serif;--noite:#000000;--card:#141414;--card2:#1F1F23;--linha:#2A2A2A;--chalk:#F3F3EC;--cinza:#A3A3AB;--grafite:#55555C;--volt:#D5FF3F;--flash:#EF8FC4;--cobalt:#2B3BFF;--ok:#7CE38B;--warn:#FFB547;--bad:#FF5C6C}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--noite);color:var(--chalk);font-family:Figtree,system-ui,sans-serif;font-size:15px;overflow-x:hidden}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--fh);margin:0;letter-spacing:-.01em}
.wrap{max-width:640px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 16px calc(90px + env(safe-area-inset-bottom))}
.logo{font-family:var(--fh);font-weight:800;font-size:24px;color:var(--volt);text-shadow:3px 3px 0 var(--flash);position:relative;display:inline-block;line-height:1}
.logo .sp{color:var(--flash);font-size:13px;position:absolute;left:28px;top:-8px;text-shadow:none}
.live{font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--flash);text-transform:uppercase}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button{flex:1;border:1px solid var(--linha);background:var(--card);border-radius:999px;padding:10px 6px;font-weight:700;min-height:44px;font-size:14px}
.tabs button.on{background:var(--volt);color:#000;border-color:var(--volt)}
.card{background:var(--card);border:1px solid var(--linha);border-radius:18px;padding:16px;margin-bottom:10px;min-width:0}
.job .marca{font-family:var(--fh);font-weight:700;font-size:18px;overflow-wrap:anywhere}
.job .quando{font-weight:600;margin-top:6px}
.job .det{color:var(--cinza);font-size:13px;margin-top:4px;overflow-wrap:anywhere}
.cache{font-family:var(--fh);font-weight:800;font-size:22px;color:var(--volt);margin-top:10px}
.vagas{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.vaga{border:1px solid var(--linha);border-radius:14px;padding:10px;font-size:13px;min-width:0}
.vaga b{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--cinza);margin-bottom:6px}
.btn{border:1px solid var(--linha);background:var(--card2);border-radius:999px;padding:12px 16px;font-weight:700;min-height:44px;cursor:pointer;width:100%}
.btn.p{background:var(--volt);color:#000;border-color:var(--volt)}
.btn.f{background:var(--flash);color:#131411;border-color:var(--flash)}
.btn.d{background:transparent;color:var(--bad);border-color:#5d1a24}
.btn:disabled{opacity:.4}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:3px 8px;margin:4px 4px 0 0;background:var(--card2);border:1px solid var(--linha)}
.tag.v{background:var(--volt);color:#000;border-color:var(--volt)}.tag.f{background:var(--flash);color:#131411;border-color:var(--flash)}.tag.o{background:#12301a;color:var(--ok);border-color:#1d4a29}.tag.w{background:#3a2a0b;color:var(--warn);border-color:#5a4110}
.muted{color:var(--cinza)}.small{font-size:12px}
.fld{margin-top:14px}
.fld label{display:block;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--cinza);margin-bottom:6px}
.fld input,.fld textarea{width:100%;background:var(--card);border:1px solid var(--linha);border-radius:12px;padding:12px;min-height:46px;font-size:16px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--linha);background:var(--card);border-radius:999px;padding:10px 14px;min-height:44px;font-weight:600;cursor:pointer}
.seg button.on{background:var(--volt);color:#000;border-color:var(--volt)}
.banner{background:var(--flash);color:#131411;border-radius:18px;padding:16px;margin-bottom:12px}
.warnbox{background:#3a2a0b;border:1px solid #5a4110;color:var(--warn);border-radius:12px;padding:10px 12px;font-size:13px;margin-top:10px}
.okbox{background:#12301a;border:1px solid #1d4a29;color:var(--ok);border-radius:12px;padding:10px 12px;font-size:13px;margin-top:10px}
.empty{color:var(--cinza);text-align:center;padding:30px 10px;border:1px dashed var(--linha);border-radius:16px}
.termo{background:var(--card);border:1px solid var(--linha);border-radius:16px;padding:16px;font-size:14px;line-height:1.55;max-height:52vh;overflow-y:auto}
.termo ol{padding-left:18px;margin:8px 0}
.ev{border-left:2px solid var(--linha);padding:4px 0 10px 12px;font-size:13px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet .in{background:var(--noite);border:1px solid var(--linha);border-radius:22px 22px 0 0;width:100%;max-width:640px;padding:18px 16px calc(24px + env(safe-area-inset-bottom));max-height:90vh;overflow-y:auto}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--volt);color:#000;font-weight:700;border-radius:999px;padding:12px 18px;z-index:99;max-width:90vw;text-align:center}
.toast.err{background:var(--bad);color:#fff}
.foot{margin-top:24px;font-size:13px;color:var(--cinza);border-top:1px solid var(--linha);padding-top:14px}
.row{display:flex;gap:8px}.row>*{flex:1}
.logo{font-family:"Bricolage Grotesque",Figtree,sans-serif!important}
html,body{font-size:15.5px}
:root{--cinza:#B9B9C2}
h1,h2,h3{font-weight:800}
@keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}.sheet .in.shake{animation:shk .25s}
.logoimg{height:46px;width:auto;display:block;margin:0 auto}
.tprog{display:flex;align-items:center;gap:10px;margin:6px 0 12px;font-size:12px;color:var(--cinza)}.tpb{flex:1;height:6px;background:var(--card);border-radius:99px;overflow:hidden}.tpb i{display:block;height:100%;width:0;background:var(--volt);transition:.25s}
.titens{display:flex;flex-direction:column;gap:8px}.titem{display:grid;grid-template-columns:28px 1fr;gap:4px 10px;background:var(--card);border:1px solid var(--linha);border-radius:16px;padding:12px;transition:.15s}
.titem .tn{width:26px;height:26px;border-radius:99px;background:var(--linha);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}.titem .tt b{font-size:14.5px}.titem .tt p{margin:3px 0 0;font-size:13px;color:var(--cinza);line-height:1.45}
.titem .tbtn{grid-column:2;justify-self:start;margin-top:8px;border:1px solid var(--linha);background:transparent;color:var(--chalk);border-radius:99px;padding:8px 16px;font:inherit;font-weight:700;font-size:13px;cursor:pointer}
.titem.ok{border-color:var(--volt)}.titem.ok .tn{background:var(--volt);color:#000}.titem.ok .tbtn{background:var(--volt);color:#000;border-color:var(--volt)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.calbar{display:flex;justify-content:flex-end;margin:4px 0 10px}.seg2{display:flex;background:var(--card);border:1px solid var(--linha);border-radius:99px;padding:3px}.seg2 button{border:0;background:none;color:var(--chalk);font:inherit;font-weight:700;font-size:12.5px;padding:7px 14px;border-radius:99px;cursor:pointer}.seg2 button.on{background:var(--volt);color:#000}
.calw{background:var(--card);border:1px solid var(--linha);border-radius:18px;padding:12px}.calh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.calh b{font-size:16px;text-transform:capitalize}.calh button{width:36px;height:36px;border-radius:12px;border:1px solid var(--linha);background:none;color:var(--chalk);font-size:18px;cursor:pointer}
.calg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.calg .wd{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--cinza);text-align:center;padding:2px 0}
.cd{min-height:84px;border:1px solid var(--linha);background:#0b0b0b;border-radius:10px;padding:4px;display:flex;flex-direction:column;gap:3px;align-items:stretch;text-align:left;color:var(--chalk);font:inherit;cursor:default;overflow:hidden}
.cd .n{font-size:12px;font-weight:700;color:var(--cinza)}.cd.fora{opacity:.35}.cd.hoje .n{color:var(--volt)}.cd.tem{cursor:pointer;border-color:#3a3a3a}.cd.tem:hover{border-color:var(--volt)}.cd.sel{border-color:var(--volt);box-shadow:0 0 0 1px var(--volt) inset}
.cd .lv{display:block;background:var(--volt);color:#000;border-radius:6px;padding:3px 5px;font-size:10.5px;line-height:1.25;white-space:normal}.cd .lv.meu{background:var(--flash)}.cd .lv em{display:block;font-style:normal;font-weight:800}.cd .lv i{font-style:normal}.cd .mais{font-size:10px;color:var(--cinza)}
.diah{font-size:16px;margin:16px 0 8px}.diah::first-letter{text-transform:uppercase}
@media(max-width:560px){.cd{min-height:60px;padding:2px}.cd .lv{font-size:8.5px;padding:2px;letter-spacing:-.02em}.cd .lv i{display:none}.cd .lv em{font-size:9.5px}}
</style>
</head>

const TERMO_VERSAO="v2-2026-10";

function $(s){return document.querySelector(s)}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function brl(v){return (Number(v)||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"})}
const DL=["domingo","segunda","terça","quarta","quinta","sexta","sábado"],ML=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
function dExt(d){d=new Date(d);return DL[d.getDay()]+", "+d.getDate()+" de "+ML[d.getMonth()]}
function hm(d){d=new Date(d);return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")}
function horas(a,b){const h=(new Date(b)-new Date(a))/36e5;return String(Math.round(h*10)/10).replace(".",",")+" h"}
function toast(m,err){const t=$("#toast");t.textContent=m;t.className="toast"+(err?" err":"");t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,err?4500:2400)}
function local(j){return j.local_tipo==="estudio"?ESTUDIO+(j.espaco?" · espaço "+j.espaco:""):j.local_tipo==="cliente"?(j.local_endereco||"Local do cliente"):"Online"}
function erro(e){const m=(e&&e.message)||"";return /fetch|network/i.test(m)?"Sem conexão. Tente de novo.":m}
function openSheet(h){S_dirty=false;$("#sheetIn").innerHTML=h;$("#sheet").hidden=false}
function closeSheet(){$("#sheet").hidden=true;$("#sheetIn").innerHTML="";S_dirty=false}
let S_dirty=false;document.addEventListener("input",e=>{if(e.target.closest&&e.target.closest("#sheetIn"))S_dirty=true},true);document.addEventListener("change",e=>{if(e.target.closest&&e.target.closest("#sheetIn"))S_dirty=true},true);
document.addEventListener("click",e=>{const b=e.target.closest("#sheetIn [data-act=fechar]");if(b&&S_dirty&&!b.dataset.armed){e.stopImmediatePropagation();e.preventDefault();b.dataset.armed="1";const t=b.textContent;b.textContent="Fechar sem salvar?";b.classList.add("d");setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent=t;b.classList.remove("d")}},4000)}},true);

/* ---------- login ---------- */
function renderLogin(msg,modo){
  $("#app").innerHTML=`<div class="wrap" style="max-width:420px;margin-top:8vh"><div style="text-align:center;margin-bottom:20px"><img class="logoimg" src="${LOGO_LIMA}" alt="IMPlay"><div class="live" style="margin-top:12px">● app do seller</div></div>
  <form class="card" id="lf"><h3 style="font-size:18px">${modo==="criar"?"Criar minha conta":"Entrar"}</h3>
  <div class="fld"><label>E-mail</label><input type="email" name="email" required autocomplete="username"></div>
  <div class="fld"><label>Senha ${modo==="criar"?"(mínimo 6)":""}</label><input type="password" name="senha" required minlength="6" autocomplete="${modo==="criar"?"new-password":"current-password"}"></div>
  ${msg?`<div class="warnbox">${esc(msg)}</div>`:""}
  <button class="btn p" style="margin-top:16px">${modo==="criar"?"Criar conta":"Entrar"}</button>
  <button type="button" class="btn" style="margin-top:8px" id="alt">${modo==="criar"?"Já tenho conta":"Criar conta nova"}</button></form>
  <p class="small muted" style="text-align:center">Aqui você vê as lives da IMPlay e escolhe as que quiser fazer.</p></div>`;
  $("#alt").onclick=()=>renderLogin("",modo==="criar"?"":"criar");
  $("#lf").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const email=f.get("email"),password=f.get("senha");
    const r=modo==="criar"?await db.auth.signUp({email,password}):await db.auth.signInWithPassword({email,password});
    if(r.error)return renderLogin(/Invalid/.test(r.error.message)?"E-mail ou senha errados.":/registered/.test(r.error.message)?"Este e-mail já tem conta. Toque em 'Já tenho conta'.":r.error.message,modo);
    boot()};
}
async function boot(){
  const {data:{session}}=await db.auth.getSession();if(!session)return renderLogin();
  S.email=session.user.email;
  const {data:me,error}=await db.rpc("imp_entrar",{p_app:"seller"});
  if(error)return renderLogin("Erro: "+erro(error));
  S.me=me&&me.id?me:null;
  if(!S.me)return renderCadastro();
  if(S.me.status==="pendente")return renderPendente();
  if(S.me.status!=="ativo")return renderMsg("Seu acesso está inativo. Fale com a Implay.");
  if(!S.me.termo_aceito_em||S.me.termo_versao!==TERMO_VERSAO)return renderTermo();
  await load();render();
}
function renderMsg(t){$("#app").innerHTML=`<div class="wrap"><div class="card"><p>${t}</p><button class="btn" data-act="sair">Sair</button></div></div>`}
function renderCadastro(){const m=S.me||{};

  <button class="btn p" style="margin-top:16px">${S.me?"Salvar":"Enviar cadastro"}</button>${S.me?`<button type="button" class="btn" style="margin-top:8px" data-act="voltar">Voltar</button>`:""}</form>
  <div class="foot">Conectado como ${esc(S.email)} · <a href="#" data-act="sair" style="color:var(--cinza)">Sair</a></div></div>`;
  $("#cf").onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));if(!f.vinculo)return toast("Escolha como você presta serviço",true);

}

 ["exclusividade","Posso trabalhar para outras empresas","Não tenho exclusividade. Posso prestar serviço para quem eu quiser, inclusive concorrentes."],
 ["cancelar","Posso cancelar","Cancelar com pelo menos 24 horas de antecedência não traz prejuízo. Depois disso, o cancelamento só fica registrado."],
 ["tributos","Nota fiscal e impostos são comigo","Quando aplicável (MEI/PJ), emito nota fiscal direto para quem me paga, inclusive a marca cliente, e recolho meus próprios tributos."],
 ["registro","Tudo fica registrado","Minhas escolhas, cancelamentos e este aceite ficam registrados neste app com data e hora."]];
const TERMO_EMPRESA="IMPLAY LIVE COMMERCE LTDA, CNPJ 69.448.022/0001-15";
S.termoOk=S.termoOk||{};
function termoProgresso(){const n=TERMO_ITENS.filter(t=>S.termoOk[t[0]]).length;const nome=($("#tNome")||{}).value||"";const okNome=nome.trim().split(/\s+/).length>=2;
  const p=$("#tProg");if(p)p.textContent=`${n} de ${TERMO_ITENS.length} confirmados`;const bar=$("#tBar");if(bar)bar.style.width=(n/TERMO_ITENS.length*100)+"%";
  const b=$("#tAceitar");if(b){b.disabled=!(n===TERMO_ITENS.length&&okNome);b.textContent=n<TERMO_ITENS.length?`Confirme os ${TERMO_ITENS.length-n} itens que faltam`:!okNome?"Escreva seu nome completo":"Assinar e entrar"}}
function renderTermo(){const re=S.me.termo_aceito_em&&S.me.termo_versao!==TERMO_VERSAO;
  $("#app").innerHTML=`<div class="wrap"><div class="top"><img class="logoimg" src="${LOGO_LIMA}" alt="IMPlay"></div>
  <h2 style="font-size:20px;margin:6px 0 4px">Antes de começar: como funciona</h2>
  <p class="muted small" style="margin-bottom:10px">${re?"Atualizamos o termo. ":""}Leia cada ponto e toque em <b>Entendi</b>. É rapidinho e deixa tudo claro entre você e a ${TERMO_EMPRESA}.</p>
  <div class="tprog"><div class="tpb"><i id="tBar"></i></div><span id="tProg"></span></div>
  <div class="titens">${TERMO_ITENS.map(([k,t,d],i)=>`<div class="titem ${S.termoOk[k]?"ok":""}" data-k="${k}"><div class="tn">${i+1}</div><div class="tt"><b>${t}</b><p>${d}</p></div><button type="button" class="tbtn" data-act="tItem" data-v="${k}">${S.termoOk[k]?"✓ Entendi":"Entendi"}</button></div>`).join("")}</div>
  <div class="card" style="margin-top:12px"><div class="fld" style="margin-top:0"><label>Assinatura · escreva seu nome completo</label><input id="tNome" autocomplete="name" value="${esc(S.me.nome||"")}"></div>
  <p class="small muted" style="margin-top:8px">Declaro que li e entendi cada ponto acima e que presto serviço à ${TERMO_EMPRESA} como profissional autônomo(a). Versão ${TERMO_VERSAO}.</p></div>
  <button class="btn p" style="margin-top:12px" data-act="aceitar" id="tAceitar" disabled>Assinar e entrar</button><button class="btn" style="margin-top:8px" data-act="sair">Agora não (sair)</button></div>`;
  termoProgresso();$("#tNome").addEventListener("input",termoProgresso)}
/* ---------- dados ---------- */
async function load(){
  const [a,b]=await Promise.all([db.rpc("imp_mural"),db.rpc("imp_meus_jobs")]);
  if(a.error||b.error){toast(erro(a.error||b.error),true)}
  S.mural=a.data||[];S.meus=b.data||[];
}
async function refresh(){if(!S.me||S.me.status!=="ativo"||!S.me.termo_aceito_em||S.me.termo_versao!==TERMO_VERSAO)return;await load();if($("#sheet").hidden)render()}

/* ---------- telas ---------- */
function render(){
  const conv=S.meus.filter(j=>j.status==="aberto"&&j.minha_vaga==="substituto"&&j.principal_livre&&new Date(j.inicio)>new Date());
  const prox=S.meus.filter(j=>j.status==="aberto"&&new Date(j.fim)>new Date());
  $("#app").innerHTML=`<div class="wrap"><div class="top"><div><img class="logoimg" src="${LOGO_LIMA}" alt="IMPlay"><div class="live" style="margin-top:8px">● app do seller</div></div><div class="small muted" style="text-align:right">${esc(S.me.nome)}</div></div>
  <div class="tabs">${[["mural","Lives abertas"],["meus","Minha agenda"+(prox.length?" ("+prox.length+")":"")],["perfil","Perfil"]].map(([k,l])=>`<button data-act="tab" data-v="${k}" class="${S.tab===k?"on":""}">${l}</button>`).join("")}</div>
  ${conv.map(j=>`<div class="banner"><b>A vaga de principal abriu.</b><br>${esc(j.marca)} · ${dExt(j.inicio)}, ${hm(j.inicio)}. Quer assumir? (você decide)<button class="btn" style="margin-top:10px;background:#fff;color:#000" data-act="pegar" data-id="${j.id}" data-v="principal">Quero ser o principal</button></div>`).join("")}
  ${S.tab==="mural"?mural():S.tab==="meus"?meus():perfil()}
  <div class="foot">Conectado como ${esc(S.email)} · <a href="#" data-act="sair" style="color:var(--cinza)">Sair desta conta</a></div></div>`;
}
function vaga(j,tipo){const livre=tipo==="principal"?j.principal_livre:j.substituto_livre;const minha=j.minha_vaga===tipo;
  return `<div class="vaga"><b>${tipo==="principal"?"Principal":"Substituto"}</b>${minha?`<span class="tag v">é você</span>`:livre?(j.minha_vaga?`<span class="tag">livre</span>`:`<button class="btn ${tipo==="principal"?"p":""}" style="padding:10px" data-act="pegar" data-id="${j.id}" data-v="${tipo}">Quero</button>`):`<span class="tag">preenchida</span>`}</div>`}
function cardMural(j){return `<div class="card job">
   <div class="marca">${esc(j.marca||"Live")}</div>
   <div class="quando">${dExt(j.inicio)} · ${hm(j.inicio)}–${hm(j.fim)} (${horas(j.inicio,j.fim)})</div>
   <div class="det">📍 ${esc(local(j))}</div>${j.requisitos?`<div class="det">${esc(j.requisitos)}</div>`:""}
   ${j.valor_seller?`<div class="cache">${brl(j.valor_seller)}</div>`:`<div class="det">Valor a combinar</div>`}
   <div class="vagas">${vaga(j,"principal")}${vaga(j,"substituto")}</div></div>`}
function cardMeu(j){return `<div class="card job"><div class="marca">${esc(j.marca||"Live")}</div>
   <div class="quando">${dExt(j.inicio)} · ${hm(j.inicio)}–${hm(j.fim)} (${horas(j.inicio,j.fim)})</div><div class="det">📍 ${esc(local(j))}</div>
   <span class="tag ${j.minha_vaga==="principal"?"v":"f"}">${j.minha_vaga}</span>${j.valor_seller?`<span class="tag">${brl(j.valor_seller)}</span>`:""}
   <button class="btn d" style="margin-top:12px" data-act="cancelar" data-id="${j.id}">Cancelar minha participação</button></div>`}
/* ---------- calendário ---------- */
S.cal=S.cal||{view:"cal",mes:null,dia:null};
const MESES=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
function ymdL(d){d=new Date(d);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function locCurto(j){return j.local_tipo==="estudio"?(j.espaco?"Sala "+j.espaco:"Estúdio"):"Fora"}
function durH(j){const h=(new Date(j.fim)-new Date(j.inicio))/36e5;return (Math.round(h*10)/10).toString().replace(".",",")+"h"}
function calView(list,card,vazio){
  const v=S.cal.view;const tg=`<div class="calbar"><div class="seg2"><button data-act="calView" data-v="cal" class="${v==="cal"?"on":""}">📅 Calendário</button><button data-act="calView" data-v="lista" class="${v==="lista"?"on":""}">☰ Lista</button></div></div>`;
  if(!list.length)return tg+`<div class="empty">${vazio}</div>`;
  if(v==="lista")return tg+list.map(card).join("");
  let m=S.cal.mes?new Date(S.cal.mes):new Date(list[0].inicio);m=new Date(m.getFullYear(),m.getMonth(),1);S.cal.mes=m.toISOString();
  const por={};list.forEach(j=>{const k=ymdL(j.inicio);(por[k]=por[k]||[]).push(j)});
  const doMes=list.filter(j=>{const d=new Date(j.inicio);return d.getMonth()===m.getMonth()&&d.getFullYear()===m.getFullYear()});
  if(!S.cal.dia||!por[S.cal.dia]||new Date(S.cal.dia+"T12:00").getMonth()!==m.getMonth())S.cal.dia=doMes.length?ymdL(doMes[0].inicio):null;
  const ini=new Date(m);ini.setDate(1-m.getDay());const hoje=ymdL(new Date());let cells="";
  for(let i=0;i<42;i++){const d=new Date(ini);d.setDate(ini.getDate()+i);const k=ymdL(d);const js=por[k]||[];const fora=d.getMonth()!==m.getMonth();
    if(i>=35&&fora&&d.getDay()===0)break;
    cells+=`<button class="cd ${fora?"fora":""} ${k===hoje?"hoje":""} ${js.length?"tem":""} ${k===S.cal.dia?"sel":""}" ${js.length?`data-act="calDia" data-v="${k}"`:"disabled"}><span class="n">${d.getDate()}</span>${js.slice(0,3).map(j=>`<span class="lv ${j.minha_vaga?"meu":""}"><b>${hm(j.inicio).replace(":00","h")}</b> · ${durH(j)}<i> · ${esc(locCurto(j))}</i>${j.valor_seller?`<em>${brl(j.valor_seller).replace(",00","")}</em>`:""}</span>`).join("")}${js.length>3?`<span class="mais">+${js.length-3}</span>`:""}</button>`}
  const dia=S.cal.dia?por[S.cal.dia]||[]:[];
  return tg+`<div class="calw"><div class="calh"><button data-act="calMes" data-v="-1">‹</button><b>${MESES[m.getMonth()]} ${m.getFullYear()}</b><button data-act="calMes" data-v="1">›</button></div>
   <div class="calg">${["dom","seg","ter","qua","qui","sex","sáb"].map(x=>`<span class="wd">${x}</span>`).join("")}${cells}</div>
   <div class="small muted" style="margin-top:8px">${doMes.length?`${doMes.length} live${doMes.length>1?"s":""} neste mês · toque no dia para ver e escolher · <span style="color:var(--flash)">■</span> rosa = você já está`:"Nenhuma live neste mês. Use as setas para ver outros meses."}</div></div>
   ${dia.length?`<h3 class="diah">${dExt(dia[0].inicio)}</h3>`+dia.map(card).join(""):""}`}
function mural(){
  return `<p class="small muted" style="margin-top:0">Escolha só o que quiser fazer. O primeiro que pegar fica com a vaga. O substituto entra se o principal não puder.</p>`+calView(S.mural,cardMural,"Nenhuma live aberta agora. Volte mais tarde ✦")}
function meus(){
  const now=new Date();const prox=S.meus.filter(j=>j.status==="aberto"&&new Date(j.fim)>now).sort((a,b)=>new Date(a.inicio)-new Date(b.inicio));const pass=S.meus.filter(j=>!(j.status==="aberto"&&new Date(j.fim)>now));
  return calView(prox,cardMeu,"Você ainda não escolheu nenhuma live. Veja em Lives abertas.")
   +(pass.length?`<h3 style="font-size:15px;margin:20px 0 10px">Anteriores</h3>`+pass.map(j=>`<div class="card job" style="opacity:.8"><b>${esc(j.marca||"")}</b> · ${dExt(j.inicio)}<br><span class="tag ${j.status==="realizado"?"o":""}">${j.status==="aberto"?"passou":j.status}</span><span class="tag">${j.minha_vaga}</span></div>`).join(""):"")}
const EV={escolheu_principal:"Você escolheu ser principal",escolheu_substituto:"Você escolheu ser substituto",substituto_assumiu_principal:"Você assumiu como principal",cancelou:"Você cancelou",
  convite_assumir_principal:"Convite para assumir como principal",termo_aceito:"Você aceitou o termo",cadastro_seller:"Você fez seu cadastro",perfil_atualizado:"Você atualizou seu perfil",
  empresa_definiu_principal:"A empresa te colocou como principal",empresa_definiu_substituto:"A empresa te colocou como substituto",empresa_removeu_principal:"A empresa te tirou do principal",empresa_removeu_substituto:"A empresa te tirou do substituto"};
function perfil(){const m=S.me;
  return `<div class="card"><b>${esc(m.nome)}</b><div class="small muted">${esc(m.email)} · ${esc(m.telefone||"")}</div><div class="small muted">${esc(m.vinculo||"")}${m.cnpj?" · "+esc(m.cnpj):""}${m.pix?" · Pix "+esc(m.pix):""}</div>
  <div class="okbox">Termo ${esc(m.termo_versao||"")} assinado em ${new Date(m.termo_aceito_em).toLocaleString("pt-BR")}</div><button class="btn" style="margin-top:12px" data-act="editar">Editar meus dados</button></div>
  <h3 style="font-size:15px;margin:18px 0 10px">Meu histórico</h3><div id="hist"><button class="btn" data-act="hist">Ver meu histórico</button></div>`}

/* ---------- ações ---------- */
document.addEventListener("click",async e=>{
  const sb=e.target.closest("[data-seg] button");if(sb){const g=sb.parentElement;g.querySelectorAll("button").forEach(b=>b.classList.remove("on"));sb.classList.add("on");g.previousElementSibling.value=sb.dataset.v;return}
  if(e.target===$("#sheet")){const i=$("#sheetIn");i.classList.remove("shake");void i.offsetWidth;i.classList.add("shake");return}
  const a=e.target.closest("[data-act]");if(!a)return;if(a.tagName==="A")e.preventDefault();const id=a.dataset.id,v=a.dataset.v;
  switch(a.dataset.act){
    case"sair":await db.auth.signOut();S.me=null;renderLogin();break;
    case"tab":S.tab=v;render();break;
    case"calView":S.cal.view=v;render();break;
    case"calMes":{const m=new Date(S.cal.mes);m.setMonth(m.getMonth()+Number(v));S.cal.mes=m.toISOString();S.cal.dia=null;render();break}
    case"calDia":S.cal.dia=v;render();{const h=document.querySelector(".diah");if(h)h.scrollIntoView({behavior:"smooth",block:"start"})}break;
    case"recarregar":boot();break;
    case"editar":renderCadastro();break;
    case"voltar":boot();break;
    case"tItem":{S.termoOk[v]=!S.termoOk[v];const it=a.closest(".titem");it.classList.toggle("ok",!!S.termoOk[v]);a.textContent=S.termoOk[v]?"✓ Entendi":"Entendi";termoProgresso();if(S.termoOk[v]){const nx=[...document.querySelectorAll(".titem:not(.ok)")][0];if(nx)nx.scrollIntoView({behavior:"smooth",block:"center"})}break}
    case"aceitar":{if(a.disabled)return;const itens=TERMO_ITENS.map(t=>({k:t[0],t:t[1],ok:!!S.termoOk[t[0]]}));const {error}=await db.rpc("imp_aceitar_termo",{p_versao:TERMO_VERSAO,p_itens:itens,p_assinatura:$("#tNome").value.trim()});if(error)return toast(erro(error),true);toast("Pronto! Bem-vindo(a) ✦");boot();break}
    case"pegar":{a.disabled=true;const {error}=await db.rpc("imp_pegar",{p_job:id,p_vaga:v});if(error){toast(erro(error),true);await refresh();return}
      toast(v==="principal"?"Vaga de principal é sua ✦":"Você é o substituto ✦");S.tab="meus";await refresh();break}
    case"cancelar":{const j=S.meus.find(x=>x.id===id);const perto=new Date(j.inicio)-new Date()<24*36e5;
      openSheet(`<h3 style="font-size:18px">Cancelar ${esc(j.marca||"")}?</h3><p class="muted">${dExt(j.inicio)} · ${hm(j.inicio)}</p>
      ${perto?`<div class="warnbox">Faltam menos de 24 horas. Você pode cancelar, mas fica registrado como cancelamento em cima da hora.</div>`:`<div class="okbox">Mais de 24 horas antes: cancelamento sem prejuízo.</div>`}
      <div class="fld"><label>Motivo (opcional)</label><textarea id="motivo"></textarea></div>
      <button class="btn d" style="margin-top:14px" data-act="cancelarOk" data-id="${id}">Cancelar participação</button><button class="btn" style="margin-top:8px" data-act="fechar">Voltar</button>`);break}
    case"cancelarOk":{if(!a.dataset.armed){a.dataset.armed=1;a.textContent="Toque de novo para confirmar";return}
      const {data,error}=await db.rpc("imp_cancelar",{p_job:id,p_motivo:($("#motivo")||{}).value||""});if(error)return toast(erro(error),true);
      closeSheet();toast(data==="no_prazo"?"Cancelado, sem prejuízo":"Cancelado (registrado como em cima da hora)");await refresh();break}
    case"fechar":closeSheet();break;
    case"hist":{const {data,error}=await db.rpc("imp_meu_historico");if(error)return toast(erro(error),true);
      $("#hist").innerHTML=(data||[]).map(e=>{const d=e.detalhe||{};let t=EV[e.tipo]||e.tipo;if(e.tipo==="cancelou")t+=d.prazo==="no_prazo"?" (no prazo)":" (menos de 24h antes)";
        return `<div class="ev"><span class="small muted">${new Date(e.em).toLocaleString("pt-BR")}</span><br><b>${esc(t)}</b>${e.marca?` · ${esc(e.marca)}, ${dExt(e.inicio)}`:""}</div>`}).join("")||`<div class="muted small">Sem registros.</div>`;break}
  }
});
document.addEventListener("visibilitychange",()=>{if(!document.hidden)refresh()});
setInterval(refresh,60000);
boot();
</script>
</body>
</html>
